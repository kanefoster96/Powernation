<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop Cheerwear | Power Nation</title>
  <meta name="description" content="Shop cheer bows, practice wear, warm-ups, backpacks, accessories and Nfinity cheer shoes by colour or category.">
  <meta name="theme-color" content="#0b0a0e">
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="shop">
  <div data-include="header"></div>

  <main id="main" class="wrap">
    <div class="shop-top">
      <h1 class="display" id="shop-title" style="font-size:clamp(3rem,9vw,6.5rem)">Shop all</h1>
      <p class="lede" id="shop-sub">Bows, practice wear, warm-ups and kit bags in your team colours.</p>
    </div>

    <div class="shop-layout">
      <aside class="filters" aria-label="Filters">
        <div class="field">
          <label for="shop-search">Search</label>
          <input id="shop-search" type="search" placeholder="Bows, hoodie, backpack…" autocomplete="off">
        </div>
        <div>
          <h2>Category</h2>
          <ul class="filter-cats" id="filter-cats"></ul>
        </div>
        <div>
          <h2>Colour</h2>
          <div class="filter-colours" id="filter-colours"></div>
        </div>
      </aside>

      <section aria-labelledby="shop-title">
        <div class="toolbar">
          <div class="active-filters" id="active-filters"></div>
          <div style="display:flex;gap:12px;align-items:center;margin-left:auto">
            <span class="toolbar__count" id="shop-count" aria-live="polite"></span>
            <label class="sr-only" for="shop-sort">Sort</label>
            <select id="shop-sort">
              <option value="featured">Featured</option>
              <option value="new">Newest</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
            </select>
          </div>
        </div>
        <div class="grid" id="shop-grid"></div>
      </section>
    </div>
  </main>

  <div data-include="footer"></div>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
